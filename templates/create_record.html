<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    {% if flag == 1 %}
        <h3>Δημιουργήθηκε έγγραφο με κωδικό {{ id }}</h3>

</html>
